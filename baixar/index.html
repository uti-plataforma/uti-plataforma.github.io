      (() => {
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try { const saved = localStorage.getItem('uti-theme'); if (saved === 'dark' || saved === 'light') theme = saved; } catch {}

      })();
